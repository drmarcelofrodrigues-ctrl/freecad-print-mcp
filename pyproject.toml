[project]
name = "freecad-print-mcp"
version = "0.1.0"
description = "Servidor MCP para modelar peças de impressão 3D no FreeCAD em modo headless (sem GUI), direto do Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcelo Ferreira Rodrigues (AnestWorks)" }]
keywords = ["freecad", "mcp", "3d-printing", "claude", "cad", "bambu"]
dependencies = [
    "mcp>=1.2",
    "trimesh>=4.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
freecad-print-mcp = "freecad_print_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_print_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
